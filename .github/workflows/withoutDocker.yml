name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.VM_USERNAME }}/backend/"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Stopping old Spring Boot ==="
            pkill -f 'java -jar /opt/backend' || true
            sleep 3
            
            echo "=== Checking files ==="
            ls -l /opt/backend/
            
            echo "=== Starting new Spring Boot ==="
            nohup java -jar /opt/backend/*.jar \
              --server.port=8081 \
              --spring.datasource.url=jdbc:mysql://localhost:3306/project \
              --spring.datasource.username=root \
              --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
              > /opt/backend/app.log 2>&1 &
            
            sleep 5
            
            echo "=== Checking if running ==="
            if sudo netstat -tlnp | grep 8081; then
              echo "✅ Spring Boot is running!"
            else
              echo "❌ Spring Boot failed!"
              cat /opt/backend/app.log
              exit 1
            fi
